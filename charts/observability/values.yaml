collector:
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.111.0"
  # o pipeline abaixo vira o config.yaml do Collector (ConfigMap)
  logSpans: true          # exporter "debug": imprime os spans no log do Collector

jaeger:
  enabled: true
  image:
    repository: jaegertracing/all-in-one
    tag: "1.62.0"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
