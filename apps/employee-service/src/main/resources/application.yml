spring:
  application:
    name: employee
  data:
    mongodb:
      # MONGO_* vêm do chart Helm (Secret do MongoDB + ConfigMap); os defaults servem para rodar local
      uri: mongodb://${MONGO_USER:root}:${MONGO_PASSWORD:lab-password}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:lab}?authSource=admin

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
